name: Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: pnpm
      - run: |
          pnpm install
          pnpm i semantic-release @semantic-release/changelog @semantic-release/git
          pnpm exec playwright install
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run type-check
      - run: pnpm run test
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
